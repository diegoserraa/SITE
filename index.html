    <script>
      // aplica o tema antes da primeira pintura, senão pisca o tema errado
      // por uma fração de segundo ao carregar (FOUC)
      (function () {
        try {
          var saved = localStorage.getItem("zdm-theme");
          var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
